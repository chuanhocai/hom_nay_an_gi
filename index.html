<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Chạm nhẹ tiêu chí, tìm món ăn hợp ý" />
<title>Hôm Nay Ăn Gì? — Chạm Nhẹ Tiêu Chí, Tìm Món Hợp Ý</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<style>
:root{--bg:#0f0e0d;--surface:#171614;--surface-2:#1f1d1b;--border:#2a2724;--border-hover:#423d38;--text:#f3f1ed;--text-secondary:#9c968e;--text-muted:#6b665f;--accent:#e07a38;--accent-soft:rgba(224,122,56,.12);--accent-border:rgba(224,122,56,.45);--gold:#d9a05b;--radius:12px;--t:.2s cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding:32px 20px 80px}
.container{max-width:1140px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand-title{font-size:1.75rem;font-weight:700;letter-spacing:-.03em}
.brand-sub{font-size:.88rem;color:var(--text-secondary);margin-top:4px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all var(--t)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{color:var(--text-secondary);font-size:.85rem;font-weight:500;padding:9px 14px;border-radius:8px}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}
.btn-outline{font-size:.85rem;font-weight:500;padding:9px 15px;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
.btn-outline:hover{border-color:var(--border-hover);background:var(--surface-2)}
.btn-accent{background:var(--accent);color:#fff;font-size:.88rem;font-weight:600;padding:10px 18px;border-radius:8px}
.btn-accent:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.controls{margin-bottom:28px}
.search-wrap{position:relative;margin-bottom:16px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 16px 11px 38px;border-radius:10px;font-size:.9rem;outline:none}
.search-input:focus{border-color:var(--accent-border)}
.filter-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.filter-row{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid rgba(42,39,36,.55)}
.filter-row:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none}
.filter-title{min-width:115px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;color:var(--text-secondary);padding:5px 12px;border-radius:6px;border:1px solid transparent}
.chip:hover{color:var(--text);background:var(--surface-2)}
.chip.active{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-border);font-weight:600}
.advanced-filters{margin-top:14px;padding-top:14px;border-top:1px solid rgba(42,39,36,.55)}
.advanced-filters.hidden{display:none}
.toggle-advanced{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn-toggle-adv{font-size:.8rem;color:var(--text-secondary)}
.btn-toggle-adv:hover{color:var(--text)}
#activeFilterSummary{font-size:.76rem;color:var(--text-muted)}
.spotlight{display:none;position:sticky;top:14px;z-index:80;background:rgba(23,22,20,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--accent-border);border-radius:var(--radius);padding:16px 22px;margin-bottom:24px;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.spotlight.show{display:flex}
.spot-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.spot-name{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.spot-sub{font-size:.83rem;color:var(--text-secondary)}
.spot-actions{display:flex;align-items:center;gap:8px}
.btn-close-spot{color:var(--text-muted);font-size:1.1rem;padding:6px 10px;border-radius:8px}
.btn-close-spot:hover{color:var(--text);background:var(--surface-2)}
.status-bar{margin-bottom:16px;font-size:.84rem;color:var(--text-secondary)}
.status-bar strong{color:var(--text)}
.fallback-banner{display:none;background:var(--surface);border-left:2px solid var(--gold);padding:10px 14px;margin-bottom:16px;font-size:.83rem;color:var(--text-secondary);border-radius:0 8px 8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
.empty{color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px 0}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;scroll-margin-top:130px;transition:border-color var(--t),transform var(--t)}
.card:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.card.picked{border-color:var(--accent);background:linear-gradient(180deg,rgba(224,122,56,.08),var(--surface))}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-emoji{font-size:1.65rem;line-height:1}
.card-price{font-size:.76rem;color:var(--gold);font-weight:500}
.card-cat{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px}
.card-name{font-size:1.02rem;font-weight:600;margin-bottom:12px;line-height:1.35}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid rgba(42,39,36,.55)}
.tag{font-size:.72rem;color:var(--text-secondary);background:var(--bg);padding:2px 8px;border-radius:4px}
.tag.mine{color:var(--accent)}
.btn-del{margin-left:auto;font-size:.72rem;color:var(--text-muted);padding:2px 8px;border-radius:4px}
.btn-del:hover{color:#ff6b6b;background:var(--surface-2)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:440px;max-height:92vh;overflow-y:auto;padding:24px}
.modal h3{font-size:1.12rem;font-weight:600;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:.88rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;background:var(--surface-2);border:1px solid var(--border);font-size:1.15rem;box-shadow:0 6px 20px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(10px);z-index:90}
.btn-top.show{opacity:1;visibility:visible;transform:none}
.btn-top:hover{border-color:var(--accent);color:var(--accent)}
.spot-history{font-size:.76rem;color:var(--text-muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot-history:empty{display:none}
.form-error{min-height:1.2em;margin-top:8px;font-size:.8rem;color:#ff8a8a}
.btn-del.confirm{color:#ff6b6b;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--surface-2);border:1px solid var(--border-hover);padding:10px 16px;border-radius:10px;font-size:.84rem;opacity:0;visibility:hidden;z-index:120;transition:all var(--t);max-width:90vw}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media(max-width:680px){body{padding:20px 14px 60px}.filter-row{flex-direction:column;gap:6px}.filter-title{min-width:auto}.grid{grid-template-columns:1fr}.spot-name{font-size:1.15rem}.card{scroll-margin-top:150px}.btn-top{bottom:20px;right:20px}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 class="brand-title">🍜 Hôm Nay Ăn Gì?</h1>
      <p class="brand-sub">Chạm nhẹ tiêu chí, tìm món hợp ý</p>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" id="btnReset">Đặt lại</button>
      <button class="btn-outline" id="btnOpenModal">+ Thêm món</button>
      <button class="btn-accent" id="btnRandom">🎲 Chọn ngẫu nhiên</button>
    </div>
  </header>

  <section class="controls">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" id="searchInput" class="search-input" aria-label="Tìm món ăn" placeholder="Tìm món ăn, bánh, kem, trà sữa... (gõ không dấu cũng được)" />
    </div>
    <div class="filter-box">
      <div class="filter-row"><span class="filter-title">Danh mục</span><div class="chips" data-filter="cat" id="catChips"></div></div>
      <div class="filter-row"><span class="filter-title">Nhiệt độ</span><div class="chips" data-filter="temp"></div></div>
      <div class="filter-row"><span class="filter-title">Hình thức</span><div class="chips" data-filter="type"></div></div>
      <div class="filter-row"><span class="filter-title">Khẩu vị</span><div class="chips" data-filter="taste"></div></div>
      <div class="advanced-filters" id="advancedFilters">
        <div class="filter-row"><span class="filter-title">Thời điểm</span><div class="chips" data-filter="meal"></div></div>
        <div class="filter-row"><span class="filter-title">Ngân sách</span><div class="chips" data-filter="budget"></div></div>
        <div class="filter-row"><span class="filter-title">Đặc tính</span><div class="chips" data-filter="vibe"></div></div>
      </div>
      <div class="toggle-advanced">
        <button class="btn-toggle-adv" id="btnToggleAdv" aria-expanded="true">Thu gọn bộ lọc nâng cao ↑</button>
        <span id="activeFilterSummary">Đang hiển thị toàn bộ thực đơn</span>
      </div>
    </div>
  </section>

  <div class="spotlight" id="spotlight" aria-live="polite">
    <div>
      <div class="spot-label">Gợi ý hôm nay</div>
      <div class="spot-name" id="spotTitle"></div>
      <div class="spot-sub" id="spotMeta"></div>
      <div class="spot-history" id="spotHistory"></div>
    </div>
    <div class="spot-actions">
      <button class="btn-accent" id="btnReroll">↻ Đổi món khác</button>
      <button class="btn-close-spot" id="btnCloseSpot" title="Đóng thanh gợi ý" aria-label="Đóng thanh gợi ý">✕</button>
    </div>
  </div>

  <div class="status-bar" id="resultsCount" aria-live="polite"></div>
  <div class="fallback-banner" id="fallbackNote"></div>
  <main class="grid" id="foodGrid"></main>
</div>

<div class="modal-overlay" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Thêm món mới vào thực đơn</h3>
    <div class="field"><label for="newName">Tên món ăn hoặc đồ uống *</label><input type="text" id="newName" maxlength="80" placeholder="Ví dụ: Trà sữa ô long nhài..." /></div>
    <div class="field-row">
      <div class="field"><label for="newCat">Danh mục</label><select id="newCat"></select></div>
      <div class="field"><label for="newTemp">Nhiệt độ</label><select id="newTemp"></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="newType">Hình thức</label><select id="newType"></select></div>
      <div class="field"><label for="newTaste">Khẩu vị</label><select id="newTaste"></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="newMeal">Thời điểm</label><select id="newMeal"></select></div>
      <div class="field"><label for="newBudget">Mức giá</label><select id="newBudget"></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="newVibe">Đặc tính</label><select id="newVibe"></select></div>
      <div class="field"><label for="newPrice">Giá hiển thị</label><input type="text" id="newPrice" maxlength="40" value="30.000đ - 45.000đ" /></div>
    </div>
    <p class="form-error" id="formError" role="alert"></p>
    <div class="modal-foot">
      <button class="btn-ghost" id="btnCloseModal">Hủy</button>
      <button class="btn-accent" id="btnSaveFood">Lưu món</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<button class="btn-top" id="btnBackToTop" title="Lên đầu trang" aria-label="Lên đầu trang">↑</button>

<script>

/* ---------- Tiện ích ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Bỏ dấu tiếng Việt để tìm "pho" ra "Phở"
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const STORE_KEY = "customFoods_v3";
function loadCustom() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    return Array.isArray(data) ? data.filter(f => f && typeof f.name === "string").map(f => ({ ...f, custom: true })) : [];
  } catch { return []; }
}

}

function buildControls() {
  $("catChips").innerHTML = `<button class="chip active" data-val="all" aria-pressed="true" id="chipAllCat"></button>` +

    g.innerHTML = `<button class="chip active" data-val="all" aria-pressed="true">${ALL_LABEL[key] || "Tất cả"}</button>` +

  });

/* ---------- Lọc ---------- */
function updateFilterSummary() {
  const parts = Object.entries(filters).filter(([k, v]) => k !== "search" && v !== "all").map(([k, v]) => k === "cat" ? CAT_LABELS[v] : LABELS[v]);
  if (filters.search.trim()) parts.push(`"${filters.search.trim()}"`);
  $("activeFilterSummary").textContent = parts.length ? "Đang lọc: " + parts.join(" · ") : "Đang hiển thị toàn bộ thực đơn";
}

function getFilteredFoods() {
  const q = norm(filters.search.trim());
  const exact = foods.filter(item => {
    if (q && !norm(item.name).includes(q)) return false;
    return ["cat","temp","type","taste","meal","budget","vibe"].every(k => filters[k] === "all" || item[k] === filters[k]);
  });
  // Có từ khoá tìm kiếm hoặc đã có ít nhất 1 món khớp => không cần fallback
  if (q || exact.length >= 1) return { list: exact, fallback: false };

  const pool = filters.cat === "all" ? foods : foods.filter(i => i.cat === filters.cat);
  const W = { temp:2, type:2, taste:2, meal:1, budget:1, vibe:1 };
  const scored = pool.map(item => {
    let score = 0;
    for (const k in W) if (filters[k] !== "all" && item[k] === filters[k]) score += W[k];
    return { item, score };
  }).sort((a, b) => b.score - a.score);
  return { list: scored.slice(0, 8).map(s => s.item), fallback: true };
}

function foodCard(f) {
  const tags = [f.temp, f.taste, f.vibe].map(k => `<span class="tag">${esc(LABELS[k] || "")}</span>`).join("");
  const del = f.custom ? `<span class="tag mine">Của bạn</span><button class="btn-del" data-del="${esc(f.id)}" aria-label="Xóa món ${esc(f.name)}">Xóa</button>` : "";
  return `<article class="card ${f.id === pickedId ? "picked" : ""}" id="food-${esc(f.id)}">
    <div>
      <div class="card-head"><span class="card-emoji">${esc(f.emoji)}</span><span class="card-price">${esc(f.price)}</span></div>
      <div class="card-cat">${esc(CAT_LABELS[f.cat] || f.cat)}</div>
      <h3 class="card-name">${esc(f.name)}</h3>
    </div>
    <div class="card-tags">${tags}${del}</div>
  </article>`;
}

function render() {
  updateFilterSummary();
  $("chipAllCat").textContent = `Tất cả (${foods.length})`;
  const { list, fallback } = getFilteredFoods();
  currentMatches = list;
  updateRerollState();
  $("resultsCount").innerHTML = `Hiển thị <strong>${list.length}</strong> lựa chọn`;
  const note = $("fallbackNote");
  note.style.display = fallback ? "block" : "none";
  if (fallback) note.innerHTML = "Không có món nào khớp đồng thời tất cả điều kiện — đang gợi ý các lựa chọn <strong>gần tiêu chí nhất</strong>.";
  $("foodGrid").innerHTML = list.length
    ? list.map(foodCard).join("")
    : `<p class="empty">Không tìm thấy món phù hợp với từ khóa "${esc(filters.search)}".</p>`;
}

function updateRerollState() {
  const one = currentMatches.length <= 1, spinning = spinTimer !== null;
  $("btnRandom").disabled = spinning || currentMatches.length === 0;
  $("btnReroll").disabled = spinning || one;
  $("btnReroll").title = one ? "Chỉ có 1 lựa chọn, không có món nào khác để đổi" : "";
}
function stopSpin() { clearInterval(spinTimer); spinTimer = null; updateRerollState(); }
function resetPick() { stopSpin(); pickedId = null; seen.clear(); passed = []; $("spotHistory").textContent = ""; $("spotlight").classList.remove("show"); }

/* ---------- Sự kiện: bộ lọc ---------- */
document.querySelectorAll(".chips").forEach(group => {
  group.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    group.querySelectorAll(".chip").forEach(c => { c.classList.remove("active"); c.setAttribute("aria-pressed", "false"); });
    btn.classList.add("active"); btn.setAttribute("aria-pressed", "true");
    filters[group.dataset.filter] = btn.dataset.val;
    resetPick(); render();
  });
});

$("searchInput").addEventListener("input", debounce(e => { filters.search = e.target.value; resetPick(); render(); }, 150));

$("btnToggleAdv").addEventListener("click", () => {
  const hidden = $("advancedFilters").classList.toggle("hidden");
  $("btnToggleAdv").setAttribute("aria-expanded", String(!hidden));
  $("btnToggleAdv").textContent = hidden ? "Mở rộng bộ lọc (Thời điểm, Ngân sách, Đặc tính) ↓" : "Thu gọn bộ lọc nâng cao ↑";
});

/* ---------- Quay ngẫu nhiên ---------- */
function showSpot(f, full) {
  $("spotTitle").textContent = `${f.emoji} ${f.name}`;
  $("spotMeta").textContent = [CAT_LABELS[f.cat], f.price].concat(full ? [LABELS[f.temp], LABELS[f.vibe]] : []).join(" • ");
}
function choosePick() {
  let cand = currentMatches.filter(f => !seen.has(f.id));
  if (!cand.length) {                       // đã quay hết vòng: bắt đầu vòng mới, nhưng không trùng món hiện tại
    seen.clear(); if (pickedId) seen.add(pickedId);
    cand = currentMatches.filter(f => !seen.has(f.id));
  }
  if (!cand.length) cand = currentMatches;  // chỉ có 1 món
  return cand[Math.floor(Math.random() * cand.length)];
}
function pickRandom() {
  if (!currentMatches.length) return;
  stopSpin();
  const prev = foods.find(f => f.id === pickedId);
  if (prev) passed = [...passed.filter(n => n !== prev.name), prev.name].slice(-5);
  const final = choosePick();
  $("spotlight").classList.add("show");
  $("btnRandom").disabled = true; $("btnReroll").disabled = true;
  let count = 0;
  spinTimer = setInterval(() => {
    if (++count < 10) { showSpot(currentMatches[Math.floor(Math.random() * currentMatches.length)], false); return; }
    stopSpin();
    pickedId = final.id; seen.add(final.id);
    showSpot(final, true);
    const hist = passed.filter(n => n !== final.name);
    $("spotHistory").textContent = hist.length ? "Đã lướt qua: " + hist.join(" · ") : "";
    render();
    $("food-" + pickedId)?.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 60);
}
$("btnRandom").addEventListener("click", pickRandom);
$("btnReroll").addEventListener("click", pickRandom);
$("btnCloseSpot").addEventListener("click", () => { resetPick(); render(); });

/* ---------- Đặt lại ---------- */
$("btnReset").addEventListener("click", () => {
  Object.keys(filters).forEach(k => filters[k] = k === "search" ? "" : "all");
  $("searchInput").value = "";
  document.querySelectorAll(".chips").forEach(g => g.querySelectorAll(".chip").forEach((c, i) => {
    c.classList.toggle("active", i === 0); c.setAttribute("aria-pressed", String(i === 0));
  }));
  resetPick(); render();
});

/* ---------- Xóa món tự thêm ---------- */
$("foodGrid").addEventListener("click", e => {
  const btn = e.target.closest("[data-del]");
  if (!btn) return;
  const f = foods.find(x => x.id === btn.dataset.del);
  if (!f) return;
  if (btn.dataset.arm !== "1") {            // bấm lần 1: hỏi lại ngay trên nút, không dùng confirm()
    btn.dataset.arm = "1"; btn.textContent = "Bấm lần nữa để xóa"; btn.classList.add("confirm");
    setTimeout(() => { if (btn.isConnected) { btn.dataset.arm = ""; btn.textContent = "Xóa"; btn.classList.remove("confirm"); } }, 3000);
    return;
  }
  foods = foods.filter(x => x.id !== f.id);
  saveCustom();
  if (pickedId === f.id) resetPick();
  render();
});

/* ---------- Modal thêm món ---------- */
const modal = $("modalBackdrop");
function openModal() { $("formError").textContent = ""; modal.classList.add("open"); $("newName").focus(); }
function closeModal() { modal.classList.remove("open"); $("btnOpenModal").focus(); }
function saveFood() {
  const name = $("newName").value.trim();
  if (!name) { $("formError").textContent = "Vui lòng nhập tên món."; return $("newName").focus(); }
  $("formError").textContent = "";
  const cat = $("newCat").value;
  foods.unshift({
    id: newId(), custom: true, name, cat,
    temp: $("newTemp").value, type: $("newType").value, taste: $("newTaste").value,
    meal: $("newMeal").value, budget: $("newBudget").value, vibe: $("newVibe").value,
    price: $("newPrice").value.trim() || "30.000đ - 45.000đ",
    emoji: EMOJI_BY_CAT[cat] || "🍽️"
  });
  if (!saveCustom()) showToast("Không lưu được vào bộ nhớ trình duyệt — món này chỉ tồn tại đến khi tải lại trang.");
  $("newName").value = ""; setModalDefaults();
  closeModal(); render();
}
$("btnOpenModal").addEventListener("click", openModal);
$("btnCloseModal").addEventListener("click", closeModal);
$("btnSaveFood").addEventListener("click", saveFood);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
$("newName").addEventListener("input", () => { $("formError").textContent = ""; });
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") saveFood(); });
document.addEventListener("keydown", e => {
  if (!modal.classList.contains("open")) return;
  if (e.key === "Escape") return closeModal();
  if (e.key === "Tab") {   // focus trap đơn giản
    const f = [...modal.querySelectorAll("input,select,button")];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- Nút lên đầu trang ---------- */
window.addEventListener("scroll", () => $("btnBackToTop").classList.toggle("show", window.scrollY > 350), { passive: true });
$("btnBackToTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

buildControls();
render();
</script>
</body>
</html>
