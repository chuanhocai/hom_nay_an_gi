<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hôm Nay Ăn Gì? - 200 Món Ngon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
  <style>
    :root {
      --bg: #14110f;
      --surface: #1f1a17;
      --surface-hover: #2a231e;
      --border: #332a24;
      --text: #f5efe6;
      --text-muted: #a89b8c;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-soft: rgba(249, 115, 22, 0.15);
      --accent: #fbbf24;
      --success: #22c55e;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fb923c, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.18s ease;
    }
